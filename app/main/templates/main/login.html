<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LakshyaX</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}?v=5">
</head>
<body class="signin-body">
    {% include 'navigation.html' %}
    <main id="login-section">
        <div class="login-container">
            <h2>Sign In</h2>
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div>
                    <label for="login-username">Username</label>
                    <input id="login-username" type="text" name="username" autocomplete="username" required>
                </div>
                <div>
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Login</button>

                <p>Don't have an account? <a href="{% url "register" %}" class="already-have-account">Sign up</a></p>
            </form>
        </div>
    </main>
</body>
</html>
